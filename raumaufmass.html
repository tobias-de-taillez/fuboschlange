<!doctype html>

<script id="core">
"use strict";
// ================= Konstanten =================
const TOL_RANK = 1e-8;   // Rangtoleranz, relativ zur größten Spaltennorm
const TOL_RED  = 0.01;   // darunter gilt eine Messung als nicht prüfbar
const TOL_MODE = 0.05;   // Anteil am Flex-Mode -> Pfeil statt Ellipse
const SIGMA_DEF = 5;     // angenommene Standardabweichung je Messung, mm
const SUGGEST_CHECK_MAX = 3;  // Deckel der Vorschlaege zur Pruefbarkeit

// ================= Grundlagen =================
const dist=(p,q)=>Math.hypot(p.x-q.x, p.y-q.y);
const idx=pts=>{ const m={}; pts.forEach((p,i)=>m[p.id]=i); return m; };
const activeMeas=meas=>meas.filter(m=>m.on!==false);

function residuals(pts, meas){
  const I=idx(pts);
  return activeMeas(meas).map(m=>dist(pts[I[m.a]], pts[I[m.b]]) - m.d);
}

// Zeile je Messung: d|xa-xb|/dxa = +u, d/dxb = -u, alles andere 0.
function jacobian(pts, meas){
  const I=idx(pts), n=pts.length;
  return activeMeas(meas).map(m=>{
    const a=I[m.a], b=I[m.b], pa=pts[a], pb=pts[b];
    const L=dist(pa,pb)||1e-9;   // ponytail: zwei deckungsgleiche Punkte sind
                                 // Eingabefehler, nicht Mathematik - nur kein NaN
    const ux=(pa.x-pb.x)/L, uy=(pa.y-pb.y)/L;
    const row=new Array(2*n).fill(0);
    row[2*a]=ux; row[2*a+1]=uy; row[2*b]=-ux; row[2*b+1]=-uy;
    return row;
  });
}

// Gauss-Jordan mit Spaltenpivotierung, mehrere rechte Seiten.
// ponytail: dicht und dumm - bei 2n <= 60 Unbekannten ist sparse reiner Aufwand.
function luSolve(A, B){
  const k=A.length; if(!k) return [];
  const p=B[0].length;
  let mx=0; for(const r of A) for(const x of r) mx=Math.max(mx,Math.abs(x));
  const eps=1e-12*(mx||1);
  const M=A.map((r,i)=>r.concat(B[i]));
  for(let c=0;c<k;c++){
    let piv=c;
    for(let r=c+1;r<k;r++) if(Math.abs(M[r][c])>Math.abs(M[piv][c])) piv=r;
    if(Math.abs(M[piv][c])<eps) return null;
    [M[c],M[piv]]=[M[piv],M[c]];
    const d=M[c][c];
    for(let j=c;j<k+p;j++) M[c][j]/=d;
    for(let r=0;r<k;r++){
      if(r===c) continue;
      const f=M[r][c]; if(f===0) continue;
      for(let j=c;j<k+p;j++) M[r][j]-=f*M[c][j];
    }
  }
  return M.map(r=>r.slice(k));
}

function matTmat(A){
  const m=A.length, k=m?A[0].length:0;
  const N=Array.from({length:k},()=>new Array(k).fill(0));
  for(let i=0;i<m;i++) for(let a=0;a<k;a++){
    const va=A[i][a]; if(!va) continue;
    for(let b=a;b<k;b++) N[a][b]+=va*A[i][b];
  }
  for(let a=0;a<k;a++) for(let b=0;b<a;b++) N[a][b]=N[b][a];
  return N;
}

function matTvec(A,v){
  const m=A.length, k=m?A[0].length:0, g=new Array(k).fill(0);
  for(let i=0;i<m;i++) for(let a=0;a<k;a++) g[a]+=A[i][a]*v[i];
  return g;
}

// Rangaufdeckendes modifiziertes Gram-Schmidt ueber die SPALTEN.
// Doppelte Orthogonalisierung: die Rangerkennung ist genau die Stelle, an der
// einfache Genauigkeit kippt, und ein falscher Rang ist eine falsche Aussage
// darueber, wieviele Messungen fehlen.
function gramSchmidt(rows, tol){
  const m=rows.length, k=m?rows[0].length:0;
  const col=j=>rows.map(r=>r[j]);
  let scale=0;
  for(let j=0;j<k;j++) scale=Math.max(scale, Math.hypot(...col(j)));
  const t=(tol??TOL_RANK)*(scale||1);
  const Q=[], R=[], piv=[];
  for(let j=0;j<k;j++){
    const v=col(j), coef=new Array(Q.length).fill(0);
    for(let pass=0;pass<2;pass++){
      for(let q=0;q<Q.length;q++){
        let d=0; for(let i=0;i<m;i++) d+=Q[q][i]*v[i];
        coef[q]+=d;
        for(let i=0;i<m;i++) v[i]-=d*Q[q][i];
      }
    }
    R.forEach((row,q)=>row[j]=coef[q]);
    const nv=Math.hypot(...v);
    if(nv>t){
      for(let i=0;i<m;i++) v[i]/=nv;
      Q.push(v); piv.push(j);
      const row=new Array(k).fill(0); row[j]=nv; R.push(row);
    }
  }
  return {Q, R, piv, rank:Q.length, m, k};
}

// Jede abhaengige Spalte liefert genau einen Nullraum-Vektor. R eingeschraenkt
// auf die Pivotspalten ist obere Dreiecksmatrix -> Rueckwaertseinsetzen.
// k kommt aus gs, nicht aus R: bei Rang 0 ist R leer, die Spaltenzahl aber
// trotzdem bekannt - und genau dann besteht der Nullraum aus allem.
function nullSpace(gs){
  const {R,piv,rank,k}=gs;
  const isPiv=new Set(piv), out=[];
  for(let j=0;j<k;j++){
    if(isPiv.has(j)) continue;
    const c=new Array(rank).fill(0);
    for(let q=rank-1;q>=0;q--){
      let s=R[q][j];
      for(let q2=q+1;q2<rank;q2++) s-=R[q][piv[q2]]*c[q2];
      c[q]=s/R[q][piv[q]];
    }
    const z=new Array(k).fill(0);
    z[j]=1; piv.forEach((p,q)=>z[p]=-c[q]);
    const nrm=Math.hypot(...z)||1;
    out.push(z.map(x=>x/nrm));
  }
  return out;
}

// h_i = Zeilennorm^2 der Orthonormalbasis der Spalten = Diagonale der Hutmatrix.
function leverage(gs){
  const h=new Array(gs.m).fill(0);
  gs.Q.forEach(q=>q.forEach((v,i)=>h[i]+=v*v));
  return h;
}

// P0.x, P0.y und eine Koordinate von P1 = genau die 3 Starrfreiheitsgrade.
// Welche Koordinate von P1: eine Drehung um P0 aendert P1.y mit der Rate
// (P1.x - P0.x). Liegt P1 senkrecht ueber P0, fixiert P1.y die Drehung gar
// nicht und das System bliebe singulaer.
function gaugeFixed(pts){
  if(pts.length<2) return [];
  const dx=Math.abs(pts[1].x-pts[0].x), dy=Math.abs(pts[1].y-pts[0].y);
  return [0, 1, dx>=dy ? 3 : 2];
}

function freeCols(pts){
  const fx=new Set(gaugeFixed(pts)), out=[];
  for(let c=0;c<2*pts.length;c++) if(!fx.has(c)) out.push(c);
  return out;
}

// Skizze auf Messgroesse bringen, bevor iteriert wird. Eine Zeile, rettet den
// Solver wenn jemand einen 8-Meter-Raum als 300-Pixel-Kritzelei gezeichnet hat.
function scaleSketch(pts, meas){
  const I=idx(pts), act=activeMeas(meas);
  if(!act.length) return pts.map(p=>({...p}));
  let sd=0, sm=0;
  act.forEach(m=>{ sd+=dist(pts[I[m.a]],pts[I[m.b]]); sm+=m.d; });
  if(sd<1e-9) return pts.map(p=>({...p}));
  const f=sm/sd;
  return pts.map(p=>({...p, x:p.x*f, y:p.y*f}));
}

// Levenberg-Marquardt. Die Daempfung geht gegen 0, sobald das System gut
// gestellt ist - sonst waere das Ergebnis systematisch zur Skizze hin verzogen.
// Bei unterbestimmten Netzen bleibt sie stehen und haelt die freien Richtungen
// genau dort, wo die Skizze sie hatte. Das ist gewollt.
function solve(pts0, meas){
  let pts=scaleSketch(pts0, meas);
  const free=freeCols(pts), nf=free.length, act=activeMeas(meas);
  if(!nf || !act.length) return {pts, iters:0, converged:true};
  const cost=P=>residuals(P,meas).reduce((s,r)=>s+r*r,0);
  let lambda=1e-3, c0=cost(pts), it=0, converged=false;
  for(; it<30; it++){
    const J=jacobian(pts,meas).map(r=>free.map(c=>r[c]));
    const v=residuals(pts,meas);
    const N=matTmat(J), g=matTvec(J,v);
    let stepNorm=0, ok=false;
    for(let tries=0; tries<8 && !ok; tries++){
      const A=N.map((row,i)=>row.map((x,j)=>i===j ? x+lambda*(1+x) : x));
      const sol=luSolve(A, g.map(x=>[-x]));
      if(!sol){ lambda*=10; continue; }
      const d=sol.map(r=>r[0]);
      const cand=pts.map(p=>({...p}));
      free.forEach((c,i)=>{ const p=cand[c>>1]; if(c&1) p.y+=d[i]; else p.x+=d[i]; });
      const c1=cost(cand);
      if(c1<=c0){ pts=cand; c0=c1; lambda=Math.max(lambda/3,1e-12); stepNorm=Math.hypot(...d); ok=true; }
      else lambda*=10;
    }
    if(!ok) break;
    if(stepNorm<0.01){ converged=true; it++; break; }
  }
  return {pts, iters:it, converged};
}

// Eine Zerlegung, drei Antworten: Rang (= fehlende Messungen), Nullraum
// (= welche Punkte noch wackeln) und Hebelwerte (= welche Messung pruefbar ist).
function analyze(pts, meas){
  const act=activeMeas(meas), m=act.length, n=pts.length;
  const free=freeCols(pts), nf=free.length;
  const Jfull=jacobian(pts,meas);
  const J=Jfull.map(r=>free.map(c=>r[c]));
  const gs=gramSchmidt(J, TOL_RANK);
  // Ohne aktive Messungen hat J null Zeilen - gramSchmidt kennt dann die Spalten-
  // zahl nicht und setzt k=0 statt nf (siehe dort). analyze kennt nf aber genau:
  // ohne jede Messung ist jede freie Koordinate ein Flex-Mode, der Nullraum also
  // die volle freie Dimension, nicht leer.
  if(m===0) gs.k=nf;
  const rank=gs.rank;
  const dof=Math.max(0, nf-rank);
  const redundancy=m-rank;
  const h=leverage(gs);
  const red=h.map(x=>Math.max(0, 1-x));
  const v=residuals(pts,meas);
  const sigmaHat = redundancy>0
    ? Math.sqrt(v.reduce((s,r)=>s+r*r,0)/redundancy)
    : null;
  const w=act.map((mm,i)=> red[i]<TOL_RED
    ? null
    : Math.abs(v[i])/((mm.sigma??SIGMA_DEF)*Math.sqrt(red[i])));
  // Moden liegen in den freien Koordinaten - auf die vollen 2n aufblasen.
  // Starrbewegungen koennen nicht dabei sein, die hat das Pinnen entfernt.
  const modes=nullSpace(gs).map(z=>{
    const f=new Array(2*n).fill(0);
    free.forEach((c,i)=>f[c]=z[i]);
    return f;
  });
  return {rank, dof, redundancy, h, red, v, w, sigmaHat, modes, free, n, m};
}

// Die drei Starrbewegungen, Drehung um den Schwerpunkt (haelt sie unabhaengig
// von der Lage des Netzes klein und numerisch gutartig).
function trivialModes(pts){
  const n=pts.length;
  const cx=pts.reduce((s,p)=>s+p.x,0)/n, cy=pts.reduce((s,p)=>s+p.y,0)/n;
  const t1=[],t2=[],t3=[];
  pts.forEach(p=>{ t1.push(1,0); t2.push(0,1); t3.push(-(p.y-cy), p.x-cx); });
  const out=[];
  for(const v0 of [t1,t2,t3]){
    const v=v0.slice();
    for(const q of out){
      let d=0; for(let i=0;i<v.length;i++) d+=q[i]*v[i];
      for(let i=0;i<v.length;i++) v[i]-=d*q[i];
    }
    const nrm=Math.hypot(...v);
    if(nrm>1e-9) out.push(v.map(x=>x/nrm));
  }
  return out;
}

// Freie Netzausgleichung mit inneren Bedingungen:
//   [ JtJ  G ] [X]   [I]
//   [ Gt   0 ] [.] = [0]
// X ist die gesuchte Pseudoinverse. Wuerde stattdessen das gepinnte System
// invertiert, waeren die Ellipsen an P0 genagelt und wuechsen mit dem Abstand
// davon - ein Artefakt der Eichung, nicht der Messqualitaet.
function covariance(pts, meas, sigmaHat){
  const n=pts.length, k=2*n;
  if(n<3) return null;
  const G=trivialModes(pts);
  if(G.length<3) return null;
  // Ohne aktive Messungen hat jacobian() 0 Zeilen; matTmat() kennt die Spaltenzahl
  // dann nicht (siehe dort) und liefert [] statt einer k x k Nullmatrix. N[i][j]
  // waere darauf ein Zugriff auf undefined[j] - ausgerechnet im unterbestimmtesten
  // Fall, den es gibt, statt der vertraglich vorgesehenen null-Antwort.
  if(!activeMeas(meas).length) return null;
  const N=matTmat(jacobian(pts,meas));
  const A=Array.from({length:k+3},()=>new Array(k+3).fill(0));
  for(let i=0;i<k;i++) for(let j=0;j<k;j++) A[i][j]=N[i][j];
  for(let i=0;i<k;i++) for(let g=0;g<3;g++){ A[i][k+g]=G[g][i]; A[k+g][i]=G[g][i]; }
  const B=Array.from({length:k+3},(_,i)=>{
    const r=new Array(k).fill(0); if(i<k) r[i]=1; return r;
  });
  const X=luSolve(A,B);
  if(!X) return null;                       // unterbestimmt -> Pfeile statt Ellipsen
  const s2=(sigmaHat!=null ? sigmaHat*sigmaHat : SIGMA_DEF*SIGMA_DEF);
  return pts.map((p,i)=>({
    xx:s2*X[2*i][2*i], xy:s2*X[2*i][2*i+1], yy:s2*X[2*i+1][2*i+1],
  }));
}

// Eigenwerte einer 2x2-Kovarianz in geschlossener Form.
function ellipse(c){
  const tr=c.xx+c.yy, det=c.xx*c.yy-c.xy*c.xy;
  const r=Math.sqrt(Math.max(0, tr*tr/4-det));
  return {
    a:Math.sqrt(Math.max(tr/2+r,0)),
    b:Math.sqrt(Math.max(tr/2-r,0)),
    ang:0.5*Math.atan2(2*c.xy, c.xx-c.yy),
  };
}

// Wandzug in Ecken-Reihenfolge bringen. Null, wenn es kein geschlossener
// Ring ueber alle Punkte ist - dann gibt es kein Polygon zum Filtern.
function wallPolygon(pts, walls){
  if(walls.length<3 || pts.length<3) return null;
  const adj={}; pts.forEach(p=>adj[p.id]=[]);
  for(const [a,b] of walls){
    if(!adj[a]||!adj[b]) return null;
    adj[a].push(b); adj[b].push(a);
  }
  if(pts.some(p=>adj[p.id].length!==2)) return null;
  const I=idx(pts), order=[pts[0].id];
  let prev=null, cur=pts[0].id;
  for(let i=1;i<pts.length;i++){
    const nxt=adj[cur].find(x=>x!==prev);
    if(nxt==null || order.includes(nxt)) return null;
    prev=cur; cur=nxt; order.push(cur);
  }
  if(adj[cur].find(x=>x!==prev)!==pts[0].id) return null;
  return order.map(id=>pts[I[id]]);
}

function pointInPoly(p, poly){
  let inside=false;
  for(let i=0,j=poly.length-1;i<poly.length;j=i++){
    const a=poly[i], b=poly[j];
    if((a.y>p.y)!==(b.y>p.y) && p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y)+a.x) inside=!inside;
  }
  return inside;
}

// Messbar heisst: die Strecke bleibt im Raum. Abtasten statt Kantenschnitte -
// faengt auch den Fall ab, dass die Strecke genau durch eine einspringende Ecke
// laeuft. ponytail: bei drei kollinearen Ecken liegen die Abtastpunkte auf dem
// Rand und das Ergebnis ist willkuerlich - ein solcher Raum ist entartet.
function segInPoly(p, q, poly, steps=32){
  for(let i=1;i<steps;i++){
    const t=i/steps;
    if(!pointInPoly({x:p.x+(q.x-p.x)*t, y:p.y+(q.y-p.y)*t}, poly)) return false;
  }
  return true;
}

const pairKey=(a,b)=>[a,b].sort().join('|');

// Messbarkeit eines Punktpaars fuer die Vorschlagsliste. Eine Wand ist per
// Definition messbar - man steht in einer Ecke und misst geradeaus zur
// naechsten. segInPoly darf dafuer gar nicht erst gefragt werden: die Wand
// LIEGT auf dem Polygonrand, und genau dort ist pointInPolys Paritaetstest
// undefiniert - Abtastpunkte auf dem Rand fallen je nach Rundung zufaellig
// rein oder raus (siehe Kommentar an segInPoly; am Test-L etwa segInPoly(A,B)
// true, segInPoly(B,C) false, obwohl beides Waende sind). Fuer echte
// Diagonalen bleibt segInPoly die richtige, einzige Pruefung - dort
// funktioniert sie, und genau dort muss z.B. die Diagonale C-F im Test-L
// weiterhin ausgeschlossen bleiben, weil sie den einspringenden Bereich quert.
function pairMeasurable(pts, walls, poly, a, b){
  const k=pairKey(a,b);
  if(walls.some(([x,y])=>pairKey(x,y)===k)) return true;
  if(!poly) return true;
  const I=idx(pts);
  return segInPoly(pts[I[a]], pts[I[b]], poly);
}

// Zwei Phasen in einem Durchlauf. Solange Messungen fehlen: die Messung
// waehlen, deren Rigiditaetszeile am staerksten in die noch freien Richtungen
// zeigt. Danach: die Messung waehlen, die die meisten bisher unpruefbaren
// Messungen pruefbar macht. Jeder Vorschlag traegt in `why`, aus welcher Phase
// er stammt - ohne das stuenden hier fuenf Eintraege, waehrend die Statuszeile
// "3 Messungen fehlen" meldet.
function suggest(pts, walls, meas){
  const poly=wallPolygon(pts,walls), I=idx(pts);
  const have=new Set(activeMeas(meas).map(m=>pairKey(m.a,m.b)));
  const cand=[], repeats=[];
  for(let i=0;i<pts.length;i++) for(let j=i+1;j<pts.length;j++){
    const key=pairKey(pts[i].id,pts[j].id);
    if(!pairMeasurable(pts, walls, poly, pts[i].id, pts[j].id)) continue;
    const pair={a:pts[i].id, b:pts[j].id};
    // Eine Wiederholung macht genau ihr eigenes Paar pruefbar - nachgemessen:
    // red steigt fuer beide Zeilen auf 0.500, alle uebrigen bleiben 0. Zur
    // Herstellung der Bestimmtheit taugt sie deshalb nie.
    if(have.has(key)) repeats.push(pair); else cand.push(pair);
  }
  const virt=c=>({a:c.a, b:c.b, d:dist(pts[I[c.a]],pts[I[c.b]]), sigma:SIGMA_DEF});
  const out=[]; let work=activeMeas(meas).slice();
  const taken=new Set();
  let checkPhase=0;
  for(let guard=0; guard<2*pts.length; guard++){
    const an=analyze(pts, work);
    let best=null, bestScore=0, why='bestimmt', bestRepeat=false;
    if(an.dof>0){
      for(const c of cand){
        if(taken.has(pairKey(c.a,c.b))) continue;
        const row=jacobian(pts,[{a:c.a,b:c.b,d:0}])[0];
        const score=an.modes.reduce((s,mo)=>{
          let d=0; for(let i=0;i<row.length;i++) d+=row[i]*mo[i];
          return s+d*d;
        },0);
        if(score>bestScore){ bestScore=score; best=c; }
      }
    } else {
      if(checkPhase>=SUGGEST_CHECK_MAX) break;
      why='pruefbar';
      const unchecked=a=>a.w.filter(x=>x===null).length;
      const base=unchecked(an);
      if(base===0) break;
      for(const c of cand.concat(repeats)){
        if(taken.has(pairKey(c.a,c.b))) continue;
        const gain=base-unchecked(analyze(pts, work.concat([virt(c)])));
        if(gain>bestScore){ bestScore=gain; best=c; bestRepeat=repeats.includes(c); }
      }
      checkPhase++;
    }
    if(!best) break;
    taken.add(pairKey(best.a,best.b));
    out.push(bestRepeat ? {a:best.a, b:best.b, why, repeat:true} : {a:best.a, b:best.b, why});
    work=work.concat([virt(best)]);
  }
  return out;
}

// Einen Zug am Punkt i auf die verbliebenen Beweglichkeiten projizieren.
// Die Moden sind die LINEARISIERTE Beweglichkeit an der aktuellen Stelle -
// ein endlicher Zug driftet also von den Messungen weg. Der Aufrufer laesst
// deshalb solve() als Korrektor nachlaufen (Praediktor-Korrektor).
function dragAlongModes(pts, modes, i, dx, dy){
  const k=modes.length;
  if(!k) return null;
  const A=[modes.map(m=>m[2*i]), modes.map(m=>m[2*i+1])];   // 2 x k
  const N=matTmat(A), g=matTvec(A,[dx,dy]);
  for(let j=0;j<k;j++) N[j][j]+=1e-9;
  const sol=luSolve(N, g.map(x=>[x]));
  if(!sol) return null;
  const c=sol.map(r=>r[0]);
  return pts.map((p,q)=>{
    let ax=0, ay=0;
    modes.forEach((m,j)=>{ ax+=c[j]*m[2*q]; ay+=c[j]*m[2*q+1]; });
    return {...p, x:p.x+ax, y:p.y+ay};
  });
}

globalThis.CORE={ TOL_RANK, TOL_RED, TOL_MODE, SIGMA_DEF, SUGGEST_CHECK_MAX,
                  dist, idx, activeMeas, residuals, jacobian, luSolve, matTmat, matTvec,
                  gramSchmidt, nullSpace, leverage, gaugeFixed, freeCols, scaleSketch, solve, analyze,
                  trivialModes, covariance, ellipse, wallPolygon, pointInPoly, segInPoly,
                  pairMeasurable, suggest, dragAlongModes };
</script>

<script id="ui">
"use strict";
const C=globalThis.CORE;

// ================= UI-Konstanten =================
// Schwellwerte fuer die Ausreisser-Markierung in renderPanel(): markiert wird
// nicht mehr eine einzelne "schlimmste" Messung, sondern alle Messungen, die
// gleichzeitig (a) ueberhaupt statistisch auffaellig sind und (b) nahe genug
// am groessten w im Feld liegen, um mathematisch gleich verdaechtig zu sein.
// Bei Redundanz 1 sind alle w z.B. mathematisch gleich gross (w_i = |c|/sigma_i
// fuer jedes i - eine Identitaet, kein Zufall; die tatsaechlich berechneten
// Werte weichen nur durch Rundung/Konvergenzrauschen minimal voneinander ab,
// daher TIE_TOL statt exaktem Vergleich), bei einem perfekten Fit sind alle w
// exakt 0. Eine einzelne "Gewinnerin" waere dort reiner Rundungsstaub.
// Siehe task-11-report.md.
const BAARDA_W0 = 3.29; // Baardas kritischer Wert fuer Data Snooping - erst darueber gilt eine Messung ueberhaupt als Ausreisser
const TIE_TOL   = 0.02; // Toleranzband ums groesste w (2% relativ): alles darin gilt als gleich verdaechtig statt durch Rundung getrennt

// Bei redundancy===0 ist jedes Residuum strukturell exakt 0 - ABER nur, wenn
// die Messungen zueinander passen. Widersprechen sie sich (z.B. ein Zahlendreher),
// kann der Fit nicht alle gleichzeitig erfuellen und verteilt den Widerspruch
// als grosse Residuen ueber das Netz. w ist hier ueberall null (siehe Badge
// "nicht pruefbar"), also gibt es keinen normierten Test - aber "nicht pruefbar"
// heisst nicht "nichts wissen": ein Residuum von mehreren sigma ist unter
// normalem Messrauschen praktisch ausgeschlossen und beweist damit einen
// Widerspruch in den Daten, unabhaengig von jeder Redundanz. Verglichen wird
// je Messung gegen ihr EIGENES sigma (sigma ist pro Messung ueberschreibbar),
// nicht gegen einen globalen Wert - eine mit sigma=20 grosszuegig eingetragene
// Zollstockmessung soll nicht beim gleichen Millimeterbetrag Alarm ausloesen
// wie eine Lasermessung mit sigma=5.
const GROSS_ERROR_SIGMA = 5; // Vielfaches von sigma, ab dem ein Residuum nicht mehr als Messrauschen erklaerbar ist

// Ellipsen sind in Wirklichkeit millimetergross, der Raum aber meterweise
// gezeichnet - unskaliert verschwindet jede Ellipse unter dem Punktmarker
// (siehe render()). EIN Faktor je Zeichnung haelt die Punkte zueinander
// ehrlich: doppelt so unsicher gemessen muss doppelt so gross gezeichnet
// werden, nicht jeder Punkt einzeln auf Sichtbarkeit getrimmt. Die Liste ist
// zugleich die Rundung auf einen sprechbaren Wert (1-2-5-Folge) und der
// Deckel (500) - ein fast perfektes Netz bekommt so nie eine absurde
// Ueberhoehung angezeigt.
const ELLIPSE_TARGET_PX = 30;  // Zielgroesse der groessten Halbachse, CSS-px
const ELLIPSE_FACTORS = [1, 2, 5, 10, 20, 50, 100, 200, 500];

// Kleinster Faktor aus ELLIPSE_FACTORS, der raw mindestens erreicht.
// Aufrunden statt runden, sonst verfehlt die Zeichnung ihr eigenes
// Sichtbarkeitsziel knapp.
function niceFactor(raw){
  for(const f of ELLIPSE_FACTORS) if(f>=raw*(1-1e-9)) return f;
  return ELLIPSE_FACTORS[ELLIPSE_FACTORS.length-1];
}

const M={ pts:[], walls:[], meas:[], mode:'point', sel:[], fit:null, an:null, sugg:[], drag:null, dragMode:null };

// Ein Zustand ist genau das, was der Nutzer eingegeben hat: Punkte, Waende,
// Messungen. Fit und Analyse werden daraus jederzeit neu gerechnet und
// gehoeren deshalb nicht hinein.
const serialize=()=>JSON.stringify({
  pts:M.pts.map(p=>({id:p.id,x:p.x,y:p.y})),
  walls:M.walls.map(w=>[...w]),
  meas:M.meas.map(m=>({...m})),
  idSeq,
});
function deserialize(o){
  M.pts=o.pts.map(p=>({...p}));
  M.walls=o.walls.map(w=>[...w]);
  M.meas=o.meas.map(m=>({...m}));
  if(typeof o.idSeq==='number') idSeq=o.idSeq;
  M.sel=[]; M.drag=null; M.fit=null; M.an=null;
}

// Formvalidierung fuer alles, was deserialize() bekommt - VOLLSTAENDIG und
// VOR jeder Zustandsaenderung. deserialize() ersetzt M.pts/M.walls/M.meas
// nacheinander und wirft mittendrin (z.B. beim Spreaden einer Wand, die kein
// Array ist), wenn die Form nur oberflaechlich (Array.isArray) geprueft
// wurde - der Zustand waere dann halb ersetzt, ohne dass irgendwo eine
// Meldung erscheint. Gibt die erste gefundene Unstimmigkeit als Text
// zurueck, sonst null. Eine Funktion, damit imp und ein kuenftiger Aufrufer
// (z.B. clr) dieselbe Pruefung teilen koennen, statt sie mehrfach leicht
// verschieden zu implementieren.
function importProblem(o){
  if(!o || typeof o!=='object') return 'Datenstruktur fehlt.';
  if(!Array.isArray(o.pts)) return 'pts fehlt oder ist keine Liste.';
  if(!Array.isArray(o.walls)) return 'walls fehlt oder ist keine Liste.';
  if(!Array.isArray(o.meas)) return 'meas fehlt oder ist keine Liste.';
  const ids=new Set();
  for(const p of o.pts){
    if(!p || typeof p!=='object') return 'pts enthält einen Eintrag ohne Objektform.';
    if(typeof p.id!=='string' || !p.id) return 'pts enthält einen Punkt ohne gültige id.';
    if(!Number.isFinite(p.x) || !Number.isFinite(p.y))
      return `Punkt ${p.id}: x/y müssen endliche Zahlen sein.`;
    if(ids.has(p.id)) return `Punkt-ID ${p.id} kommt mehrfach vor.`;
    ids.add(p.id);
  }
  for(const w of o.walls){
    if(!Array.isArray(w) || w.length!==2 || typeof w[0]!=='string' || typeof w[1]!=='string')
      return 'walls enthält einen Eintrag, der nicht aus genau zwei IDs besteht.';
    if(!ids.has(w[0]) || !ids.has(w[1]))
      return `Wand ${w[0]}–${w[1]} verweist auf einen unbekannten Punkt.`;
  }
  for(const m of o.meas){
    if(!m || typeof m!=='object') return 'meas enthält einen Eintrag ohne Objektform.';
    if(!ids.has(m.a) || !ids.has(m.b))
      return `Messung ${m.a}–${m.b} verweist auf einen unbekannten Punkt.`;
    if(!Number.isFinite(m.d) || !(m.d>0))
      return `Messung ${m.a}–${m.b}: d muss eine Zahl größer 0 sein.`;
  }
  return null;
}

const UNDO_MAX=60;
const undoStack=[];
function pushSnapshot(s){
  undoStack.push(s);
  if(undoStack.length>UNDO_MAX) undoStack.shift();
}
// Vor jeder Aenderung aufrufen, nicht danach - der Stapel haelt den Zustand
// VOR dem Schritt, sonst macht das erste Undo nichts.
function snapshot(){ pushSnapshot(serialize()); }
function undo(){
  if(!undoStack.length) return false;
  deserialize(JSON.parse(undoStack.pop()));
  recompute();
  return true;
}

// --- Punkt-IDs: A..Z, dann AA, AB, ...
// Der Zaehler laeuft monoton und wird beim Loeschen NICHT zurueckgesetzt.
// Waere er an M.pts.length gebunden, ergaebe "A,B,C anlegen, B loeschen,
// neuer Punkt" wieder ein C - und zwei Punkte haetten dieselbe ID.
let idSeq=0;
function nextId(){
  let i=idSeq++, s='';
  do{ s=String.fromCharCode(65+i%26)+s; i=Math.floor(i/26)-1; }while(i>=0);
  return s;
}
// Umkehrung von nextId(): aus einer ID die urspruengliche laufende Nummer
// zurueckrechnen (bijektive Basis-26, A=0). Fuer den Import gebraucht: nach
// einer Luecke (ein Punkt wurde vor dem Export geloescht) ist o.pts.length
// keine verlaessliche Naeherung fuer idSeq mehr - siehe imp-Handler.
function idOrdinal(id){
  let n=0;
  for(const ch of String(id)) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}

// --- Weltkoordinaten (mm) <-> Bildschirm
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let VIEW={s:1, ox:0, oy:0};
const toScr=p=>({x:p.x*VIEW.s+VIEW.ox, y:p.y*VIEW.s+VIEW.oy});
const toWorld=(x,y)=>({x:(x-VIEW.ox)/VIEW.s, y:(y-VIEW.oy)/VIEW.s});

function autofit(){
  const P=M.fit?M.fit.pts:M.pts;
  if(!P.length){ VIEW={s:1,ox:cv.width/2,oy:cv.height/2}; return; }
  const xs=P.map(p=>p.x), ys=P.map(p=>p.y);
  const w=Math.max(...xs)-Math.min(...xs)||1000, h=Math.max(...ys)-Math.min(...ys)||1000;
  const s=Math.min((cv.width-80)/w, (cv.height-80)/h);
  VIEW={ s, ox:cv.width/2-(Math.min(...xs)+w/2)*s, oy:cv.height/2-(Math.min(...ys)+h/2)*s };
}

function recompute(){
  if(M.pts.length>=2 && C.activeMeas(M.meas).length){
    M.fit=C.solve(M.pts, M.meas);
    M.an=C.analyze(M.fit.pts, M.meas);
    // Skizze auf den Fit ziehen: solve() liefert frische Punkte in mm, M.pts
    // bliebe sonst auf Klick-Pixeln stehen, waehrend render/hit/autofit ab
    // hier M.fit.pts zeigen. Ziehen und Neuanlage schreiben aber immer in
    // M.pts - ohne Angleich liefen beide Arrays auseinander und ein einzelner
    // gezogener Punkt wuerde die Skizzenform zerstoeren. Nur x/y auf den
    // bestehenden Objekten aktualisieren, id bleibt unangetastet.
    const I=C.idx(M.pts);
    M.fit.pts.forEach(fp=>{ const p=M.pts[I[fp.id]]; if(p){ p.x=fp.x; p.y=fp.y; } });
  } else { M.fit=null; M.an=null; }
  // Einmal je Aenderung, nicht je Bild: suggest() ruft intern analyze() je
  // Kandidat auf, im Zug waere das ein Ruckeln.
  M.sugg = (M.an && M.pts.length>=3)
    ? C.suggest(M.fit?M.fit.pts:M.pts, M.walls, M.meas) : [];
  render();
  // Ein Aufmass dauert leicht eine halbe Stunde. Ein Reload darf es nicht
  // kosten. Bewusst ohne Debounce: serialize() ist bei den hier realistischen
  // Groessen unter einer Millisekunde.
  try{ localStorage.setItem('raumaufmass', serialize()); }catch{}
}

function render(){
  const dpr=devicePixelRatio||1;
  cv.width=cv.clientWidth*dpr; cv.height=cv.clientHeight*dpr;
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  // Waehrend eines Drags aus M.pts zeichnen und die View festhalten: liefe
  // autofit() bei jeder Mausbewegung neu, wuerde die Skalierung springen und
  // der Punkt unter dem Cursor wegrutschen statt ihm zu folgen. Vor dem ersten
  // Fit genauso: ohne Loesung gibt es keinen sinnvollen Massstab, und ein Refit
  // zwischen zwei Klicks wuerde jeden Klick in einem anderen Bezugsrahmen lesen
  // als dem, der beim Zeichnen zu sehen war - die Skizze verzerrt sich, bevor
  // der Solver sie ueberhaupt bekommt.
  if(!M.drag && M.fit) autofit();
  const P=M.drag?M.pts:(M.fit?M.fit.pts:M.pts), I=C.idx(P);
  // Waende
  ctx.strokeStyle='#333'; ctx.lineWidth=2*dpr;
  M.walls.forEach(([a,b])=>{
    if(I[a]==null||I[b]==null) return;
    const p=toScr(P[I[a]]), q=toScr(P[I[b]]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  });
  // Messungen
  ctx.strokeStyle='#3a7'; ctx.lineWidth=1*dpr; ctx.setLineDash([6*dpr,4*dpr]);
  C.activeMeas(M.meas).forEach(m=>{
    if(I[m.a]==null||I[m.b]==null) return;
    const p=toScr(P[I[m.a]]), q=toScr(P[I[m.b]]);
    ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
  });
  ctx.setLineDash([]);
  // Noch fehlende Messungen rot gestrichelt. Anderes Strichmuster als die
  // gruenen vorhandenen - Rot gegen Gruen allein waere fuer Rotgruenblinde
  // nicht unterscheidbar.
  if(M.sugg.length){
    ctx.strokeStyle='#d33'; ctx.lineWidth=1.5*dpr;
    M.sugg.forEach(sg=>{
      if(I[sg.a]==null||I[sg.b]==null) return;
      const p=toScr(P[I[sg.a]]), q=toScr(P[I[sg.b]]);
      ctx.setLineDash(sg.why==='bestimmt' ? [2*dpr,4*dpr] : [1*dpr,6*dpr]);
      ctx.beginPath(); ctx.moveTo(p.x,p.y); ctx.lineTo(q.x,q.y); ctx.stroke();
    });
    ctx.setLineDash([]);
  }
  // Jede Messung beschriftet - sonst sieht man Striche und weiss nicht, welcher
  // 4,25 m ist. Bei mehreren Werten fuers selbe Paar die Anzahl dazu.
  ctx.font=`${11*dpr}px system-ui`; ctx.textAlign='center';
  const gezeigt=new Set();
  C.activeMeas(M.meas).forEach(m=>{
    if(I[m.a]==null||I[m.b]==null) return;
    const k=[m.a,m.b].sort().join('|');
    if(gezeigt.has(k)) return;
    gezeigt.add(k);
    const alle=C.activeMeas(M.meas).filter(x=>[x.a,x.b].sort().join('|')===k);
    const p=toScr(P[I[m.a]]), q=toScr(P[I[m.b]]);
    const txt=alle.length>1 ? `${fmtM(m.d)} (${alle.length}×)` : fmtM(m.d);
    const mx=(p.x+q.x)/2, my=(p.y+q.y)/2;
    ctx.fillStyle='#fff'; ctx.fillRect(mx-22*dpr, my-8*dpr, 44*dpr, 14*dpr);
    ctx.fillStyle='#3a7'; ctx.fillText(txt, mx, my+3*dpr);
  });
  ctx.textAlign='start';
  // Punkte zuerst zeichnen, Ellipsen/Pfeile erst danach darueber: eine
  // Ellipse, die kleiner als der Punktmarker waere, muss als Ring auf dem
  // Marker sichtbar bleiben statt darunter zu verschwinden.
  P.forEach((pt,i)=>{
    const p=toScr(pt);
    ctx.fillStyle=M.sel.includes(pt.id)?'#c30':'#036';
    ctx.beginPath(); ctx.arc(p.x,p.y,5*dpr,0,7); ctx.fill();
    ctx.fillStyle='#000'; ctx.font=`${12*dpr}px system-ui`;
    ctx.fillText(pt.id, p.x+8*dpr, p.y-8*dpr);
  });
  if(M.drag && M.dragMode){
    document.getElementById('hint').textContent =
      {frei:'Skizze frei — noch keine Messung',
       moden:'Punkt folgt den Messungen',
       starr:'Raum ist bestimmt — nur verschiebbar, Maß ändern statt ziehen'}[M.dragMode];
  }
  // Unsicherheiten. Drei Faelle, die verschieden aussehen muessen:
  // ueberbestimmt -> Ellipse aus sigmaHat; bestimmt -> Ellipse aus dem
  // angenommenen sigma; beweglich -> Pfeil, weil eine Ellipse dort unendlich
  // gross waere und die Zeichnung damit luegen wuerde.
  let exagg=null;   // Ueberhoehungsfaktor dieser Zeichnung, fuer die Legende
  if(M.an){
    const moving=new Array(P.length).fill(false);
    M.an.modes.forEach(mo=>{
      const nrm=Math.hypot(...mo)||1;
      P.forEach((_,i)=>{
        if(Math.hypot(mo[2*i],mo[2*i+1])/nrm > C.TOL_MODE) moving[i]=true;
      });
    });
    const cov=M.an.dof===0 ? C.covariance(P, M.meas, M.an.sigmaHat) : null;
    // Ellipsen vorab in mm berechnen: der Ueberhoehungsfaktor braucht die
    // groesste Halbachse der GANZEN Zeichnung, bevor die erste Ellipse auf
    // den Bildschirm kommt - und es darf nur EIN Faktor fuer alle Punkte
    // gelten, sonst verzerrt sich ihre Groesse zueinander (siehe Konstanten).
    const ell = cov ? P.map((_,i)=> moving[i] ? null : C.ellipse(cov[i])) : null;
    const maxA = ell ? ell.reduce((mx,e)=> e && e.a>mx ? e.a : mx, 0) : 0;
    if(maxA>0) exagg = niceFactor(ELLIPSE_TARGET_PX*dpr/(maxA*VIEW.s));
    ctx.lineWidth=1.5*dpr;
    P.forEach((pt,i)=>{
      const c=toScr(pt);
      if(moving[i]){
        ctx.strokeStyle='#c60';
        M.an.modes.forEach(mo=>{
          const nrm=Math.hypot(...mo)||1;
          const dx=mo[2*i]/nrm, dy=mo[2*i+1]/nrm;
          const L=34*dpr;
          ctx.beginPath();
          ctx.moveTo(c.x-dx*L, c.y-dy*L); ctx.lineTo(c.x+dx*L, c.y+dy*L);
          ctx.stroke();
        });
      } else if(ell && ell[i]){
        const e=ell[i];
        ctx.strokeStyle=M.an.sigmaHat!=null?'#07a':'#999';
        ctx.setLineDash(M.an.sigmaHat!=null?[]:[3*dpr,3*dpr]);
        ctx.save(); ctx.translate(c.x,c.y); ctx.rotate(e.ang);
        ctx.beginPath();
        ctx.ellipse(0,0, e.a*VIEW.s*exagg, e.b*VIEW.s*exagg, 0, 0, 7);
        ctx.stroke(); ctx.restore(); ctx.setLineDash([]);
      }
    });
  }
  // Legende nachfuehren: null blendet sie aus, sonst bliebe eine Zahl aus
  // einer frueheren Zeichnung stehen, sobald z.B. alle Punkte beweglich sind
  // und gar keine Ellipse mehr gezeichnet wird.
  document.getElementById('exagg').innerHTML = exagg!=null
    ? ` &nbsp; Ellipsen ×${exagg} überhöht` : '';
  renderPanel();
}

function hit(wx,wy){
  const P=M.fit?M.fit.pts:M.pts;
  let best=null, bd=Infinity;
  P.forEach(p=>{ const d=C.dist(p,{x:wx,y:wy}); if(d<bd){bd=d;best=p;} });
  return (best && bd*VIEW.s < 14) ? best : null;
}

// Abstand eines Punktes zu einer Strecke, plus Fusspunkt-Parameter.
function distToSeg(p,a,b){
  const vx=b.x-a.x, vy=b.y-a.y, L2=vx*vx+vy*vy;
  const t=L2? Math.max(0,Math.min(1,((p.x-a.x)*vx+(p.y-a.y)*vy)/L2)) : 0;
  return {d:Math.hypot(p.x-(a.x+vx*t), p.y-(a.y+vy*t)), t};
}
// Naechste Wand unter dem Cursor. Nur die mittleren 70 Prozent zaehlen -
// nahe den Enden soll der Eckpunkt gewinnen, sonst kaeme man nicht mehr an ihn heran.
function nearestWall(wx,wy){
  const P=M.drag?M.pts:(M.fit?M.fit.pts:M.pts), I=C.idx(P);
  let best=null, bd=Infinity;
  M.walls.forEach(([a,b])=>{
    if(I[a]==null||I[b]==null) return;
    const r=distToSeg({x:wx,y:wy}, P[I[a]], P[I[b]]);
    if(r.t<0.15||r.t>0.85) return;
    if(r.d<bd){ bd=r.d; best={a,b}; }
  });
  return (best && bd*VIEW.s < 12) ? best : null;
}

let entryPair=null;
// Mass fuer ein Paar eintragen. Einheit ist METER - die Tabelle zeigt Meter,
// der Laser zeigt Meter, und die frueher hier verlangten Millimeter waren die
// Ursache dafuer, dass ein getipptes "4.250" einen 4,25-mm-Raum ergab, ohne
// dass eine Pruefung anschlug: sind alle Masse gleich falsch, ist das Netz
// konsistent, und Geometrie ist massstabsinvariant.
function enterMeasurement(a,b){
  const P=M.fit?M.fit.pts:M.pts, I=C.idx(P);
  if(I[a]==null||I[b]==null) return;
  entryPair={a,b};
  const mid={x:(P[I[a]].x+P[I[b]].x)/2, y:(P[I[a]].y+P[I[b]].y)/2};
  const s=toScr(mid), dpr=devicePixelRatio||1;
  const box=document.getElementById('entry');
  box.style.display='block';
  // toScr() gibt Koordinaten relativ zur Canvas-Ecke, #entry haengt aber an
  // #left - und die Canvas ist darin nicht die erste Zeile (Status/Modi stehen
  // darueber). Ohne den Versatz der Canvas selbst landet das Feld am Kopf von
  // #left statt an der Wand (browser-vermessen: cv.offsetTop ~90px).
  box.style.left=(s.x/dpr+cv.offsetLeft-60)+'px';
  box.style.top =(s.y/dpr+cv.offsetTop-18)+'px';
  const vorhanden=M.meas.filter(m=>(m.a===a&&m.b===b)||(m.a===b&&m.b===a));
  document.getElementById('entryLabel').textContent = vorhanden.length
    ? `${a}–${b} — bisher ${vorhanden.map(m=>fmtM(m.d)).join(', ')} m, weiterer Wert:`
    : `${a}–${b}`;
  const inp=document.getElementById('entryVal');
  // Carried-over aus Task 5: eine rote Fehlermarkierung (siehe commitEntry)
  // darf nicht ins naechste Paar hinueberhaengen - dieses Feld hier hat noch
  // gar keinen abgelehnten Wert gesehen. Einzige Ausnahme von "enterMeasurement
  // unangetastet": der Brief zaehlt diesen Fix explizit zu Task 8.
  inp.value=''; inp.style.background=''; inp.focus();
}
function closeEntry(){ entryPair=null; document.getElementById('entry').style.display='none'; }
function commitEntry(){
  if(!entryPair) return;
  const inp=document.getElementById('entryVal');
  const d=parseFloat(inp.value.replace(',','.'))*1000;
  if(!isFinite(d)||d<=0){ inp.style.background='#fdd'; return; }
  if(d<100 && !confirm(`${fmtM(d)} m ist sehr kurz — als Meter gemeint?\n\nOK = so übernehmen`)) return;
  snapshot();
  M.meas.push({a:entryPair.a, b:entryPair.b, d, sigma:C.SIGMA_DEF, on:true});
  closeEntry();
  recompute();
}
document.getElementById('entryOk').onclick=commitEntry;
document.getElementById('entryVal').addEventListener('keydown',e=>{
  e.stopPropagation();                       // Modus-Kuerzel duerfen hier nicht feuern
  if(e.key==='Enter') commitEntry();
  if(e.key==='Escape') closeEntry();
});
// Carried-over aus Task 5: die rote Fehlermarkierung einer abgelehnten Eingabe
// (siehe commitEntry) blieb stehen, auch nachdem ein gueltiger Wert eingetippt
// wurde. enterMeasurement() selbst bleibt unangetastet - hier wird stattdessen
// bei jeder Eingabeaenderung zurueckgesetzt.
document.getElementById('entryVal').addEventListener('input',()=>{
  document.getElementById('entryVal').style.background='';
});

// Der Snapshot eines Zugs gehoert der ERSTEN echten Bewegung, nicht dem
// Mausdruck: sonst frisst ein blosser Klick ohne Drag (Auswahl, Wandwechsel)
// das naechste Strg+Z. mousedown merkt den Vorzustand nur vor; mousemove
// committet ihn beim ersten Schritt, mouseup verwirft ihn ohne Bewegung.
let dragSnapshot=null;

cv.addEventListener('mousedown',e=>{
  const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  const w=toWorld((e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr);
  const h=hit(w.x,w.y);
  if(M.mode==='point'){
    if(h){ dragSnapshot=serialize(); M.drag=h.id; return; }
    snapshot(); M.pts.push({id:nextId(), x:w.x, y:w.y}); recompute(); return;
  }
  if(M.mode==='measure' && !h){
    const wall=nearestWall(w.x,w.y);
    // Carried-over aus Task 5: eine halb angefangene Punktauswahl (M.sel hat
    // schon einen Eintrag) darf nicht stehen bleiben, wenn stattdessen eine
    // Wand getroffen wird - sonst bleibt der erste Punkt optisch markiert,
    // waehrend das Eingabefeld schon fuer das Wandpaar offen ist. render()
    // vor dem Oeffnen des Feldes, damit die Markierung sofort verschwindet.
    if(wall){ M.sel=[]; render(); enterMeasurement(wall.a, wall.b); return; }
  }
  if(!h) return;
  M.sel.push(h.id);
  if(M.sel.length===2){
    const [a,b]=M.sel; M.sel=[];
    if(a===b){ render(); return; }
    if(M.mode==='wall'){
      const k=[a,b].sort().join('|');
      const at=M.walls.findIndex(w2=>[w2[0],w2[1]].sort().join('|')===k);
      snapshot();
      if(at>=0) M.walls.splice(at,1); else M.walls.push([a,b]);   // Klick toggelt
      recompute();
    } else {
      enterMeasurement(a,b);
    }
  } else render();
});

// Rechtsklick loescht einen Punkt samt allem, was auf ihn zeigt. Ohne die
// Kaskade blieben verwaiste Verweise in walls/meas stehen und jacobian liefe
// auf undefined. Ein Fehlklick ist auf einem Klick-Canvas sicher, und ein
// uebriger Punkt kostet dauerhaft 2 Freiheitsgrade.
cv.addEventListener('contextmenu',e=>{
  e.preventDefault();
  const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  const w=toWorld((e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr);
  const h=hit(w.x,w.y);
  if(!h) return;
  snapshot();
  M.pts=M.pts.filter(p=>p.id!==h.id);
  M.walls=M.walls.filter(([a,b])=>a!==h.id&&b!==h.id);
  M.meas=M.meas.filter(m=>m.a!==h.id&&m.b!==h.id);
  M.sel=[];
  recompute();
});

// Ziehen kennt drei Lagen:
//  - noch keine Messung: die Skizze ist frei
//  - dof > 0: der Punkt folgt der Maus so weit, wie die Messungen es zulassen
//  - dof = 0: die Form ist bestimmt, es bleibt das Verschieben des ganzen Raums
cv.addEventListener('mousemove',e=>{
  if(!M.drag) return;
  const r=cv.getBoundingClientRect(), dpr=devicePixelRatio||1;
  const w=toWorld((e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr);
  const i=M.pts.findIndex(x=>x.id===M.drag);
  if(i<0) return;
  // Erste echte Bewegung dieses Zugs: jetzt erst den bei mousedown gemerkten
  // Vorzustand auf den Undo-Stapel legen (siehe dragSnapshot oben).
  if(dragSnapshot){ pushSnapshot(dragSnapshot); dragSnapshot=null; }
  const dx=w.x-M.pts[i].x, dy=w.y-M.pts[i].y;
  if(!M.an){
    M.dragMode='frei';
    M.pts[i].x=w.x; M.pts[i].y=w.y;
  } else if(M.an.dof>0){
    M.dragMode='moden';
    const moved=C.dragAlongModes(M.pts, M.an.modes, i, dx, dy);
    if(moved){
      const fit=C.solve(moved, M.meas);     // Korrektor: zurueck auf die Messungen
      fit.pts.forEach((p,q)=>{ M.pts[q].x=p.x; M.pts[q].y=p.y; });
    }
  } else {
    M.dragMode='starr';
    M.pts.forEach(p=>{ p.x+=dx; p.y+=dy; });
  }
  render();
});
addEventListener('mouseup',()=>{
  dragSnapshot=null;                        // ohne Bewegung: verwerfen, nicht committen
  if(M.drag){ M.drag=null; M.dragMode=null; recompute(); }
});

// [data-mode] statt button schlechthin: #modes enthaelt seit Task 8 auch den
// Ring-Knopf, der keinen Modus ist und daher weder mitschaltet noch ein
// aria-pressed bekommen soll.
document.querySelectorAll('#modes button[data-mode]').forEach(b=>{
  b.onclick=()=>{
    M.mode=b.dataset.mode; M.sel=[];
    document.querySelectorAll('#modes button[data-mode]').forEach(x=>
      x.setAttribute('aria-pressed', String(x===b)));
    document.getElementById('hint').textContent=
      {point:'Klicken legt an, Ziehen verschiebt, Rechtsklick löscht',
       wall:'Zwei Punkte klicken (nochmal klicken entfernt die Wand)',
       measure:'Zwei Punkte klicken, dann Maß eintippen'}[M.mode];
    render();
  };
});
document.getElementById('ring').onclick=()=>{
  if(M.pts.length<3){ alert('Mindestens 3 Punkte nötig.'); return; }
  snapshot();
  // In Anlegereihenfolge verbinden - genau so, wie der Nutzer den Raum
  // abgelaufen ist. Ersetzt den bestehenden Zug, statt ihn zu ergaenzen.
  M.walls=M.pts.map((p,i)=>[p.id, M.pts[(i+1)%M.pts.length].id]);
  recompute();
};
// Die Hotkeys 1/2/3 sind auf window gebunden, damit sie ueberall im Dokument
// wirken - aber genau deshalb bubbelt auch ein Tastendruck im Ueberschreib-
// Feld der Messtabelle (<input>, siehe renderPanel) bis hierher. Ohne diese
// Sperre wechselt der Moduswechsel-Klick den Modus, renderPanel() baut die
// Tabelle neu auf und reisst das Eingabefeld mitten in der Eingabe aus dem
// DOM - jede Ziffer 1, 2 oder 3 im Mass wuerde das Feld zerstoeren statt sie
// einzutragen.
addEventListener('keydown',e=>{
  const t=e.target;
  if(t && (t.tagName==='INPUT' || t.tagName==='TEXTAREA' || t.isContentEditable)) return;
  if(e.key==='Escape'){
    if(entryPair){ closeEntry(); return; }
    if(M.sel.length){ M.sel=[]; render(); return; }
  }
  if((e.ctrlKey||e.metaKey) && e.key.toLowerCase()==='z'){
    e.preventDefault();
    if(!undo()) document.getElementById('hint').textContent='Nichts mehr rückgängig zu machen.';
    return;
  }
  const b=document.querySelector(`#modes button[data-mode="${
    {1:'point',2:'wall',3:'measure'}[e.key]}"]`);
  if(b) b.click();
});
addEventListener('resize',render);

const fmtM=mm=>(mm/1000).toFixed(3);

// Groesstes |v_i|/sigma_i ueber alle aktiven Messungen - je Messung gegen ihr
// EIGENES sigma normiert (siehe Kommentar an GROSS_ERROR_SIGMA), nicht gegen
// einen globalen Wert. Nur fuer den redundancy===0-Fall gedacht: dort ist w
// ueberall null, das ist also die einzige Kennzahl, die dort noch etwas ueber
// die Groesse der Widerspruechlichkeit aussagen kann.
function worstResidualRatio(){
  const act=C.activeMeas(M.meas);
  let ratio=0, v=0;
  M.an.v.forEach((vi,i)=>{
    const r=Math.abs(vi)/(act[i].sigma??C.SIGMA_DEF);
    if(r>ratio){ ratio=r; v=Math.abs(vi); }
  });
  return {ratio, v};
}

function statusText(){
  if(M.pts.length<3) return ['Zu wenig Punkte — mindestens 3 anlegen.','warn'];
  if(!M.an) return ['Noch keine Messung eingetragen.','warn'];
  if(M.fit && !M.fit.converged)
    return ['Ausgleichung nicht konvergiert — Ergebnis ist nicht belastbar.','bad'];
  if(M.an.dof>0)
    return [`Unterbestimmt — ${M.an.dof} ${M.an.dof===1?'Messung fehlt':'Messungen fehlen'}. `
           +`Gezeigt wird der beste zur Skizze passende Fit.`,'warn'];
  if(M.an.redundancy===0){
    // "Nicht pruefbar" ist nur die halbe Wahrheit: sie gilt fuer die einzelne
    // Messung (siehe Badge in der Tabelle), nicht fuer das Netz als Ganzes.
    // Passen die Messungen nicht zueinander, kann der Fit sie nicht alle
    // gleichzeitig erfuellen und die Residuen werden gross - das ist harter
    // Beweis fuer einen Fehler, auch wenn keine einzelne Messung isoliert
    // werden kann. Diese Unterscheidung ist am Residuum sichtbar, obwohl
    // "redundancy===0" fuer beide Faelle identisch ist.
    const {ratio,v}=worstResidualRatio();
    if(ratio>GROSS_ERROR_SIGMA)
      return [`Bestimmt, aber widersprüchlich — die Messungen passen nicht zueinander `
             +`(größte Abweichung ${v.toFixed(0)} mm, das ist mehr als ${GROSS_ERROR_SIGMA}× die angenommene `
             +`Messgenauigkeit). Mindestens eine Messung ist falsch — welche, lässt sich ohne `
             +`weitere Messung nicht bestimmen.`,'bad'];
    return ['Bestimmt, aber keine Messung überprüfbar — jede Messung geht ungeprüft ein.','warn'];
  }
  return [`Überbestimmt — σ̂ = ${M.an.sigmaHat.toFixed(1)} mm`,'good'];
}

function renderPanel(){
  const [txt,cls]=statusText();
  const st=document.getElementById('status');
  st.textContent=txt; st.className=cls;

  // Wandring kaputt -> Messbarkeitsfilter in suggest() ist aus (siehe dort),
  // Vorschlaege koennen also Strecken enthalten, die real durch eine Wand
  // laufen. Eigener, von statusText() unabhaengiger Hinweis: das ist kein
  // Netzzustand (unter-/ueberbestimmt/widerspruechlich), sondern eine Aussage
  // ueber den Wandzug, die mit jedem dieser Zustaende gleichzeitig gelten
  // kann. wallPolygon() entscheidet rein aus der Adjazenz der IDs, nicht aus
  // Koordinaten - M.pts reicht, ein Fit wird dafuer nicht gebraucht.
  const wwEl=document.getElementById('wallwarn');
  const ringBroken = M.walls.length>0 && !C.wallPolygon(M.pts, M.walls);
  wwEl.style.display = ringBroken ? 'block' : 'none';
  if(ringBroken) wwEl.textContent =
    'Wandzug nicht geschlossen (oder ein Punkt hat nicht genau zwei Wände) — '
   +'die Vorschlagsliste ist deshalb ungefiltert und kann Strecken enthalten, '
   +'die sich nicht direkt messen lassen.';

  const tb=document.querySelector('#tbl tbody');
  tb.innerHTML='';
  const act=C.activeMeas(M.meas);
  // Nicht die eine "schlimmste" Messung suchen, sondern alle, die gleich
  // verdaechtig sind: ueber Baardas Grenzwert (statistisch ueberhaupt ein
  // Ausreisser) UND innerhalb TIE_TOL des groessten w im Feld (mathematisch
  // nicht vom Spitzenwert zu unterscheiden). Ein klarer Spitzenreiter liefert
  // so genau eine markierte Zeile, ein Unentschieden markiert alle gleich
  // weit vorne liegenden (siehe Konstanten-Kommentar oben).
  const wMax=M.an ? M.an.w.reduce((mx,x)=>(x!=null&&x>mx)?x:mx, -Infinity) : -Infinity;
  const suspects=new Set();
  // Beide Bedingungen gelten pro Zeile, nicht nur fuers Feld-Maximum: sonst
  // koennte eine Zeile knapp unter BAARDA_W0 allein deshalb mitmarkiert
  // werden, weil ein anderer, selbst nur knapp ueber der Schwelle liegender
  // Wert zufaellig in der Naehe liegt - genau die Art Scheinbefund, die das
  // Werkzeug vermeiden soll.
  if(M.an) M.an.w.forEach((x,i)=>{
    if(x!=null && x>BAARDA_W0 && x>=wMax*(1-TIE_TOL)) suspects.add(i);
  });

  // absteigend nach w sortiert anzeigen, aber die Originalindizes behalten
  const rows=act.map((m,i)=>({m,i,w:M.an?M.an.w[i]:null}));
  rows.sort((p,q)=>(q.w??-1)-(p.w??-1));

  rows.forEach(({m,i,w})=>{
    const tr=document.createElement('tr');
    if(suspects.has(i)) tr.className='worst';
    const red=M.an?M.an.red[i]:null;
    const v=M.an?M.an.v[i]:null;
    tr.innerHTML=
      `<td>${m.a}→${m.b}</td>`+
      `<td><input value="${fmtM(m.d)}" size="6" style="text-align:right"></td>`+
      `<td>${v==null?'—':v.toFixed(1)}</td>`+
      `<td>${red==null?'—':red.toFixed(2)}</td>`+
      `<td>${w==null?'<span class="badge unchecked">nicht prüfbar</span>':w.toFixed(1)}</td>`+
      `<td><button title="Messung stilllegen/reaktivieren">${m.on===false?'aus':'an'}</button>`+
      `<button title="Messung löschen">×</button></td>`;
    const [inp]=tr.getElementsByTagName('input');
    inp.onchange=()=>{
      const d=parseFloat(inp.value.replace(',','.'))*1000;
      if(isFinite(d)&&d>0){ snapshot(); m.d=d; recompute(); }
      else { inp.value=fmtM(m.d); alert('Ungültig: Maß muss eine Zahl größer 0 sein.'); }
    };
    const [tog,del]=tr.getElementsByTagName('button');
    tog.onclick=()=>{ snapshot(); m.on=(m.on===false); recompute(); };
    del.onclick=()=>{ snapshot(); M.meas.splice(M.meas.indexOf(m),1); recompute(); };
    tb.appendChild(tr);
  });

  // Stillgelegte Messungen bleiben sichtbar, sonst findet man sie nie wieder
  M.meas.filter(m=>m.on===false).forEach(m=>{
    const tr=document.createElement('tr');
    tr.style.opacity='.45';
    tr.innerHTML=`<td>${m.a}→${m.b}</td><td>${fmtM(m.d)}</td><td>—</td><td>—</td>`+
                 `<td><span class="badge">stillgelegt</span></td><td><button>an</button></td>`;
    tr.getElementsByTagName('button')[0].onclick=()=>{ snapshot(); m.on=true; recompute(); };
    tb.appendChild(tr);
  });

  // Sind mehrere Zeilen markiert, ist das kein Darstellungsfehler, sondern
  // eine ehrliche Auskunft: Die Daten reichen nicht, um unter den gleich
  // verdaechtigen Messungen eine einzelne herauszugreifen. Bei genau einer
  // markierten Zeile (klarer Spitzenreiter) oder keiner (nichts auffaellig)
  // bleibt der Satz weg.
  const showWhy=suspects.size>1;
  const why=document.getElementById('why');
  why.textContent = showWhy
    ? 'Mehrere Messungen sind gleich verdächtig — die normierten Residuen liegen praktisch gleichauf; erst eine weitere Messung würde sie trennen.'
    : '';
  why.style.display = showWhy ? '' : 'none';

  // --- Vorschläge, nach Zweck getrennt. Ungetrennt stünden hier fünf Einträge,
  //     während die Statuszeile "3 Messungen fehlen" meldet.
  // P wie in render() hergeleitet (waehrend eines Drags aus M.pts, sonst aus
  // dem Fit) und nur einmal berechnet - keine zweite, abweichende Herleitung
  // fuer Vorschlaege und Wandlaengen getrennt.
  const P=M.drag?M.pts:(M.fit?M.fit.pts:M.pts), I=C.idx(P);
  const sg=document.getElementById('sugg');
  const list=M.sugg;
  const grp=(t,w)=>{
    const e=list.filter(s=>s.why===w);
    return e.length ? `<div style="margin-bottom:6px"><b>${t}</b><br>`
      + e.map(s=>`${s.a} ↔ ${s.b}`).join(' &nbsp; ') + '</div>' : '';
  };
  if(!M.an) sg.textContent='—';
  else if(!list.length)
    sg.textContent = M.an.dof>0
      ? 'Keine messbare Strecke bringt das Netz weiter — fehlt eine Wand im Zug?'
      : 'Nichts mehr nötig.';
  else sg.innerHTML = grp('Damit der Raum bestimmt ist:','bestimmt')
                    + grp('Damit die Messungen prüfbar werden:','pruefbar');

  // --- Wandlängen
  document.getElementById('wl').textContent = M.walls
    .map(([a,b])=>`${a}–${b}  ${fmtM(C.dist(P[I[a]],P[I[b]]))} m`).join('\n');
}

document.getElementById('exp').onclick=async()=>{
  const P=M.drag?M.pts:(M.fit?M.fit.pts:M.pts);
  const json=JSON.stringify({
    pts:P.map(p=>({id:p.id, x:Math.round(p.x), y:Math.round(p.y)})),
    walls:M.walls,
    meas:M.meas,
    idSeq,   // sonst muss ein Reimport ihn aus den IDs zurückrechnen (siehe imp)
    sigmaHat:M.an?M.an.sigmaHat:null,
  }, null, 2);
  try{ await navigator.clipboard.writeText(json); alert('JSON kopiert.'); }
  catch{ prompt('Kopieren mit Strg+C:', json); }
};
document.getElementById('imp').onclick=()=>{
  const s=prompt('JSON aus einem Export hier einfügen:');
  if(!s) return;
  let o; try{ o=JSON.parse(s); }catch{ alert('Das ist kein gültiges JSON.'); return; }
  const problem=importProblem(o);
  if(problem){ alert('JSON hat nicht die erwartete Form: '+problem); return; }
  // Vor deserialize() sichern: deserialize() uebernimmt o.idSeq, sobald es
  // eine Zahl ist - auch wenn die kleiner ist als der hiesige Stand.
  const localIdSeq=idSeq;
  snapshot();
  deserialize(o);
  // o.pts.length unterschaetzt idSeq, sobald der Export eine Luecke hat (ein
  // Punkt wurde vor dem Export geloescht). o.idSeq ist exakt, wenn vorhanden;
  // sonst aus den IDs zurueckrechnen (idOrdinal, Umkehrung von nextId).
  // Maximum mit dem VOR dem Import gueltigen lokalen Zaehler: Ein Import in
  // eine schon gefuellte Skizze darf idSeq nie verkleinern, sonst vergibt die
  // naechste neue ID wieder eine, die es schon gibt.
  const derivedIdSeq = typeof o.idSeq==='number'
    ? o.idSeq
    : o.pts.reduce((mx,p)=>Math.max(mx, idOrdinal(p.id)+1), 0);
  idSeq=Math.max(localIdSeq, derivedIdSeq);
  recompute();
};
document.getElementById('clr').onclick=()=>{
  if(!confirm('Alle Punkte, Wände und Messungen verwerfen?')) return;
  snapshot();
  deserialize({pts:[],walls:[],meas:[]});
  recompute();
};

// Ein Aufmass dauert leicht eine halbe Stunde. Ein Reload darf es nicht kosten -
// beim Start das letzte Autosave wiederherstellen, wenn eins da ist.
try{
  const gespeichert=localStorage.getItem('raumaufmass');
  if(gespeichert){
    const o=JSON.parse(gespeichert);
    if(o && Array.isArray(o.pts) && o.pts.length) deserialize(o);
  }
}catch{}

recompute();
</script>

<script id="checks">
"use strict";
// Die Assert-Funktion heisst chk, nicht A - in mehreren Tests weiter unten
// heisst eine Matrix A, und der Name darf nicht spaeter wandern muessen.
globalThis.selfChecks=function(){
  const C=globalThis.CORE, out=[]; let ok=true;
  const chk=(n,c)=>{ ok=ok&&!!c; out.push((c?'PASS ':'FAIL ')+n); };
  const near=(a,b,t)=>Math.abs(a-b)<=t;
  // --- residuals ---
  {
    const pts=[{id:'A',x:0,y:0},{id:'B',x:3000,y:4000}];
    const meas=[{a:'A',b:'B',d:5000},{a:'A',b:'B',d:4980}];
    const v=C.residuals(pts,meas);
    chk('residuals: exakte Messung -> 0', near(v[0],0,1e-9));
    chk('residuals: 20mm zu kurz gemessen -> +20', near(v[1],20,1e-9));
  }
  {
    const pts=[{id:'A',x:0,y:0},{id:'B',x:1000,y:0}];
    const meas=[{a:'A',b:'B',d:900},{a:'A',b:'B',d:800,on:false}];
    chk('residuals: on:false wird ignoriert', C.residuals(pts,meas).length===1);
  }
  // --- jacobian ---
  {
    const pts=[{id:'A',x:0,y:0},{id:'B',x:1000,y:0}];
    const J=C.jacobian(pts,[{a:'A',b:'B',d:900}]);
    chk('jacobian: Form 1x4', J.length===1 && J[0].length===4);
    chk('jacobian: waagerechte Kante -> [-1,0,1,0]',

    chk('covariance: unterbestimmt -> null',
       C.covariance(rect,[{a:'A',b:'B',d:4000}],null)===null);
    // Review-Finding 1: der unterbestimmteste Fall ueberhaupt - keine einzige
    // aktive Messung. jacobian() liefert dann 0 Zeilen; matTmat() kann die
    // Spaltenzahl nicht mehr aus den Zeilen ablesen und liefert [] statt einer
    // Nullmatrix (siehe dort). Ungeschuetzt indiziert covariance() darauf
    // undefined[j] und stuerzt ab. Mit try/catch geprueft, damit ein Absturz
    // hier als FAIL auffaellt statt den ganzen Lauf mitzureissen.
    chk('covariance: keine Messungen ueberhaupt -> null statt Absturz', (()=>{
      try{ return C.covariance(rect,[],null)===null; }catch(e){ return false; }
    })());
    chk('covariance: alle Messungen deaktiviert -> null statt Absturz', (()=>{
      try{ return C.covariance(rect,[{a:'A',b:'B',d:4000,on:false}],null)===null; }catch(e){ return false; }
    })());
    // Der mittlere Anzeigefall: bestimmt, aber redundanzfrei. Ellipsen kommen
    // dann aus dem ANGENOMMENEN sigma und werden gestrichelt gezeichnet.
    // Liefert das null, faellt Task 12 stumm in den Pfeil-Zweig.
    const seiten=[{a:'A',b:'B',d:4000},{a:'B',b:'C',d:3000},{a:'C',b:'D',d:4000},{a:'D',b:'A',d:3000}];
    const knapp=C.covariance(rect, seiten.concat([{a:'A',b:'C',d:5000}]), null);
    // Review-Finding 2: knapp.length===4 explizit mitpruefen - [].every(...) ist
    // auf [] vakuos wahr (wie bei "modes.length===1" weiter oben), der Check
    // bestuende also selbst dann, wenn covariance() faelschlich [] zurueckgaebe.
    chk('covariance: exakt bestimmt + sigmaHat null -> endliche Bloecke',
       knapp && knapp.length===4 && knapp.every(c=>isFinite(c.xx)&&isFinite(c.yy)&&c.xx>0&&c.yy>0));
    // Laenge auch hier vor dem Indizieren pruefen: knapp[1] auf einem leeren
    // Array ist undefined, und .xx darauf wirft - dann reisst dieser eine Check
    // per Exception den ganzen Lauf ab, statt einfach als FAIL durchzufallen.
    chk('covariance: B und D sind unsicherer als A und C (nur A-C gemessen)',
       knapp && knapp.length===4 && knapp[1].xx > knapp[0].xx && knapp[3].xx > knapp[2].xx);
  }
  {
    const e=C.ellipse({xx:400,xy:0,yy:100});
    chk('ellipse: Halbachsen 20 und 10', near(e.a,20,1e-9)&&near(e.b,10,1e-9));
    chk('ellipse: grosse Achse waagerecht', near(e.ang,0,1e-9));
    const e2=C.ellipse({xx:100,xy:0,yy:400});
    chk('ellipse: grosse Achse senkrecht', near(Math.abs(e2.ang),Math.PI/2,1e-9));
    // Review-Finding 3: beide Faelle oben haben xy=0 - darin verschwinden sowohl
    // das -xy*xy in der Determinante als auch das 2*xy im Winkel-Zaehler. Ein
    // fehlender Faktor 2 oder ein Vorzeichenfehler bei xy waere unbemerkt
    // geblieben. Handgerechnet: tr=500, det=250*250-150*150=40000, r=150 ->
    // a=sqrt(400)=20, b=sqrt(100)=10, ang=0.5*atan2(300,0)=pi/4.
    const e3=C.ellipse({xx:250,xy:150,yy:250});
    chk('ellipse: schiefe Kovarianz -> Halbachsen 20 und 10',
       near(e3.a,20,1e-9)&&near(e3.b,10,1e-9));
    chk('ellipse: schiefe Kovarianz -> Winkel 45 Grad', near(e3.ang,Math.PI/4,1e-9));
    // xx=yy oben ist selbst noch ein Sonderfall: atan2(y,0) haengt nur vom
    // Vorzeichen von y ab, nie von seiner Groesse - ein fehlender Faktor 2 wuerde
    // das Ergebnis dann NICHT aendern, e3 wuerde ihn also nicht fangen. Deshalb
    // zusaetzlich ein Fall mit xx!=yy, gebaut aus einer 3-4-5-Drehung (cos=4/5,
    // sin=3/5) zweier Eigenwerte 400 und 100: xx=292, xy=144, yy=208 -> a=20,
    // b=10, Winkel=atan2(3,4). Per Mutationstest geprueft: dieser Fall faengt
    // fehlenden Faktor 2, Vorzeichenfehler bei xy und det=xx*yy+xy*xy gleichermassen.
    const e4=C.ellipse({xx:292,xy:144,yy:208});
    chk('ellipse: schiefe Kovarianz mit xx!=yy -> Halbachsen 20 und 10',
       near(e4.a,20,1e-9)&&near(e4.b,10,1e-9));
    chk('ellipse: schiefe Kovarianz mit xx!=yy -> Winkel aus 3-4-5-Drehung',
       near(e4.ang,Math.atan2(3,4),1e-9));
  }
  // --- Polygon und Messbarkeit (Spec-Test 4) ---
  {
    const L=[{id:'A',x:0,y:0},{id:'B',x:8000,y:0},{id:'C',x:8000,y:2000},
             {id:'D',x:3000,y:2000},{id:'E',x:3000,y:5000},{id:'F',x:0,y:5000}];
    const walls=[['A','B'],['B','C'],['C','D'],['D','E'],['E','F'],['F','A']];
    const poly=C.wallPolygon(L,walls);
    chk('wallPolygon: geschlossener Zug -> 6 Ecken', poly && poly.length===6);
    chk('pointInPoly: Punkt im schmalen Schenkel', poly && C.pointInPoly({x:6000,y:1000},poly));
    chk('pointInPoly: Punkt im ausgesparten Bereich', poly && !C.pointInPoly({x:6000,y:4000},poly));
    chk('segInPoly: C-F verlaesst den Raum -> unzulaessig',
       poly && !C.segInPoly({x:8000,y:2000},{x:0,y:5000},poly));
    chk('segInPoly: A-E bleibt im Raum -> zulaessig',
       poly && C.segInPoly({x:0,y:0},{x:3000,y:5000},poly));
    chk('wallPolygon: offener Zug -> null',
       C.wallPolygon(L,[['A','B'],['B','C'],['C','D']])===null);
    chk('wallPolygon: Knotengrad ungleich 2 -> null',
       C.wallPolygon(L,walls.concat([['A','D']]))===null);
  }
  // --- pairMeasurable: Waende sind immer messbar, echte Diagonalen bleiben
  // gefiltert (Review-Finding 3). segInPoly ist fuer Kanten, die auf dem
  // Polygonrand LIEGEN, undefiniert: von den 6 Waenden des Test-L liefert
  // segInPoly nur fuer A-B und F-A "messbar", fuer die anderen vier
  // faelschlich "nicht messbar" (geprueft unten) - pairMeasurable darf sich
  // fuer Waende darauf nicht verlassen, muss aber fuer echte Diagonalen wie
  // C-F weiterhin genau das leisten, was segInPoly dort richtig beantwortet.
  {
    const L=[{id:'A',x:0,y:0},{id:'B',x:8000,y:0},{id:'C',x:8000,y:2000},
             {id:'D',x:3000,y:2000},{id:'E',x:3000,y:5000},{id:'F',x:0,y:5000}];
    const walls=[['A','B'],['B','C'],['C','D'],['D','E'],['E','F'],['F','A']];
    const poly=C.wallPolygon(L,walls);
    chk('pairMeasurable: segInPoly ist auf Waenden roh unzuverlaessig (Beleg fuer die Notwendigkeit des Fixes)',
       poly && C.segInPoly(L[0],L[1],poly)===true && C.segInPoly(L[1],L[2],poly)===false);
    walls.forEach(([a,b])=>chk(`pairMeasurable: Wand ${a}-${b} ist messbar`,
       poly && C.pairMeasurable(L,walls,poly,a,b)));
    chk('pairMeasurable: C-F verlaesst den Raum -> weiterhin nicht messbar',
       poly && !C.pairMeasurable(L,walls,poly,'C','F'));
    chk('pairMeasurable: A-E bleibt messbar (Kontrolle: gueltige Diagonale)',
       poly && C.pairMeasurable(L,walls,poly,'A','E'));
  }
  // --- suggest ---
  {
    const rect=[{id:'A',x:0,y:0},{id:'B',x:4000,y:0},{id:'C',x:4000,y:3000},{id:'D',x:0,y:3000}];
    const walls=[['A','B'],['B','C'],['C','D'],['D','A']];
    const seiten=[{a:'A',b:'B',d:4000},{a:'B',b:'C',d:3000},{a:'C',b:'D',d:4000},{a:'D',b:'A',d:3000}];
    const s=C.suggest(rect,walls,seiten);
    const best=s.filter(x=>x.why==='bestimmt');
    chk('suggest: genau ein Vorschlag fuer Bestimmtheit', best.length===1);
    chk('suggest: es ist eine Diagonale',
       best.length===1 && ['AC','BD'].includes([best[0].a,best[0].b].sort().join('')));
    chk('suggest: Vorschlag macht das Netz bestimmt', (()=>{
      if(best.length!==1) return false;
      const I=C.idx(rect);
      const d=C.dist(rect[I[best[0].a]],rect[I[best[0].b]]);
      return C.analyze(rect, seiten.concat([{a:best[0].a,b:best[0].b,d}])).dof===0;
    })());
    chk('suggest: schlaegt danach Messungen zur Pruefbarkeit vor',
       s.length>0 && s.some(x=>x.why==='pruefbar'));
  }
  {
    const L=[{id:'A',x:0,y:0},{id:'B',x:8000,y:0},{id:'C',x:8000,y:2000},
             {id:'D',x:3000,y:2000},{id:'E',x:3000,y:5000},{id:'F',x:0,y:5000}];
    const walls=[['A','B'],['B','C'],['C','D'],['D','E'],['E','F'],['F','A']];
    const I=C.idx(L);
    const seiten=walls.map(([a,b])=>({a,b,d:C.dist(L[I[a]],L[I[b]])}));
    chk('analyze: L mit 6 Waenden -> 3 Messungen fehlen', C.analyze(L,seiten).dof===3);
    const s=C.suggest(L,walls,seiten);
    chk('suggest: genau 3 Vorschlaege fuer Bestimmtheit',
       s.filter(x=>x.why==='bestimmt').length===3);
    chk('suggest: kein Vorschlag verlaesst den Raum',
       s.length>0 && s.every(x=>C.segInPoly(L[I[x.a]],L[I[x.b]],C.wallPolygon(L,walls))));
    chk('suggest: C-F wird nie vorgeschlagen',
       s.length>0 && !s.some(x=>[x.a,x.b].sort().join('')==='CF'));
    chk('suggest: Pruefbarkeitsphase ist gedeckelt',
       s.filter(x=>x.why==='pruefbar').length<=C.SUGGEST_CHECK_MAX);
  }
  // --- suggest: Wiederholungen ---
  {
    // Dreieck, alle drei Seiten gemessen: exakt bestimmt, nichts pruefbar, und
    // es gibt kein ungemessenes Paar mehr. Nur eine Wiederholung kann hier noch
    // Pruefbarkeit herstellen.
    const tri=[{id:'A',x:0,y:0},{id:'B',x:4000,y:0},{id:'C',x:1500,y:3000}];
    const tw=[['A','B'],['B','C'],['C','A']];
    const I=C.idx(tri);
    const tm=tw.map(([a,b])=>({a,b,d:C.dist(tri[I[a]],tri[I[b]]),sigma:C.SIGMA_DEF}));
    const a0=C.analyze(tri,tm);
    chk('suggest-Fixture: Dreieck exakt bestimmt, nichts pruefbar',
       a0.m===3 && a0.dof===0 && a0.redundancy===0 && a0.w.length===3 && a0.w.every(x=>x===null));
    const s=C.suggest(tri,tw,tm);
    chk('suggest: schlaegt trotz vollstaendig gemessener Paare etwas vor', s.length>0);
    chk('suggest: und es sind Wiederholungen', s.length>0 && s.every(x=>x.repeat===true));
    chk('suggest: Wiederholungen nur in der Pruefbarkeits-Phase',
       s.length>0 && s.every(x=>x.why==='pruefbar'));
    chk('suggest: die Wiederholung macht ihr Paar pruefbar', (()=>{
      const w=s.find(x=>x.repeat); if(!w) return false;
      const mit=tm.concat([{a:w.a,b:w.b,d:C.dist(tri[I[w.a]],tri[I[w.b]]),sigma:C.SIGMA_DEF}]);
      return C.analyze(C.solve(tri,mit).pts,mit).w.filter(x=>x!==null).length>=2;
    })());
  }
  {
    // Gegenprobe: solange ein ungemessenes Paar existiert, gewinnt es. Eine
    // Wiederholung darf die Bestimmtheit nie herstellen.
    const rect=[{id:'A',x:0,y:0},{id:'B',x:4000,y:0},{id:'C',x:4000,y:3000},{id:'D',x:0,y:3000}];
    const walls=[['A','B'],['B','C'],['C','D'],['D','A']];
    const seiten=[{a:'A',b:'B',d:4000},{a:'B',b:'C',d:3000},{a:'C',b:'D',d:4000},{a:'D',b:'A',d:3000}];
    const best=C.suggest(rect,walls,seiten).filter(x=>x.why==='bestimmt');
    chk('suggest: Bestimmtheit weiterhin ueber ein ungemessenes Paar',
       best.length===1 && !best[0].repeat);
  }
  // --- dragAlongModes ---
  {
    const rect=[{id:'A',x:0,y:0},{id:'B',x:4000,y:0},{id:'C',x:4000,y:3000},{id:'D',x:0,y:3000}];
    const seiten=[{a:'A',b:'B',d:4000},{a:'B',b:'C',d:3000},{a:'C',b:'D',d:4000},{a:'D',b:'A',d:3000}];
    const pts=C.solve(rect,seiten).pts;
    const an=C.analyze(pts,seiten);
    chk('dragAlongModes: Rechteck mit 4 Seiten hat dof 1', an.dof===1 && an.modes.length===1);
    const iC=C.idx(pts)['C'];
    const moved=C.dragAlongModes(pts,an.modes,iC,120,0);
    chk('dragAlongModes: liefert gleich viele Punkte', moved && moved.length===4);
    chk('dragAlongModes: gezogener Punkt bewegt sich', moved && Math.abs(moved[iC].x-pts[iC].x)>1);
    chk('dragAlongModes: Eingabe unveraendert', Math.abs(pts[iC].x-4000)<1e-6);
    const korr=C.solve(moved,seiten).pts;
    chk('dragAlongModes: Messungen bleiben nach Korrektur erfuellt',
       C.residuals(korr,seiten).every(v=>Math.abs(v)<0.01));
    chk('dragAlongModes: der Zug ist wirksam', Math.abs(korr[iC].x-pts[iC].x)>50);
    chk('dragAlongModes: ohne Moden -> null', C.dragAlongModes(pts,[],iC,120,0)===null);
  }
  return {ok, out};
};
// Im Browser: raumaufmass.html?test ruft die Checks auf und schreibt sie in die
// Konsole. Auf der Kommandozeile macht das test/run.mjs.
if(typeof location!=='undefined' && location.search.includes('test')){
  const r=globalThis.selfChecks();
  console[r.ok?'log':'error']('Selbstchecks\n'+r.out.join('\n'));
}
</script>
