<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>BEKOTEC Noppenmodell – Diagnose</title></head><body><main><header><div><p class="eyebrow">BEKOTEC-EN 23 FI 30 · Rohr 16 mm</p><h1>Noppenmodell prüfen</h1><p class="banner" id="plate-banner">Nur Noppenmodell – kein Heizkreis</p></div><button id="build">Noppenmodell aufbauen</button></header><section class="controls"><label>Raum <select id="shape"><option value="rectangle" selected>Rechteck</option><option value="l">L-Form</option><option value="u">U-Form</option><option value="c">C-Form</option></select></label><label>Anschlusskante <input id="edge" type="number" min="0" step="1" value="0"/></label><label>Phase u <input id="phase-u" type="number" min="0" max="74.999" step="any" value="0"/> mm</label><label>Phase v <input id="phase-v" type="number" min="0" max="74.999" step="any" value="0"/> mm</label><label>Wandabstand <input id="plate-clearance" type="number" min="8" value="75"/> mm</label></section><section class="controls layers"><label><input class="layer" type="checkbox" data-layer="room" checked/> Raum</label><label><input class="layer" type="checkbox" data-layer="wallDomain" checked/> Wandzone</label><label><input class="layer" type="checkbox" data-layer="raster" checked/> Raster</label><label><input class="layer" type="checkbox" data-layer="cells" checked/> Zellen</label><label><input class="layer" type="checkbox" data-layer="nopps" checked/> Noppen</label><label><input class="layer" type="checkbox" data-layer="forbidden" checked/> Verbotszonen</label><label><input class="layer" type="checkbox" data-layer="anchors" checked/> Posen</label><label><input class="layer" type="checkbox" data-layer="acceptedEdges" checked/> Kanten</label><label><input class="layer" type="checkbox" data-layer="rejectedEdges" checked/> Verworfene</label><label><input class="layer" type="checkbox" data-layer="witnesses" checked/> Zeugen</label></section><section class="canvas"><svg id="plate" aria-label="Noppenmodell-Diagnose"></svg><aside><h2>Status</h2><p id="plate-status">Noch nicht aufgebaut</p><p id="plate-profile"></p><p id="plate-counts"></p><p>Diese Seite validiert das Verlege-Substrat. Sie erzeugt keinen Heizkreis.</p></aside></section></main><script type="module" src="/src/plate-main.ts"></script></body></html>
