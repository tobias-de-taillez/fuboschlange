<!doctype html><html lang="de"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>FBH Einzelschleifen-Planer</title></head><body><main><header><div><p class="eyebrow">Bifilar · 16 mm · zertifiziert</p><h1>Fußbodenheizung planen</h1></div><button id="solve">Verlegeweg berechnen</button></header><section class="controls"><label>Rohrabstand <input id="spacing" type="number" min="50" max="250" value="150"/> mm</label><label>Wandabstand <input id="clearance" type="number" min="8" value="75"/> mm</label><label>Anschlussposition <input id="offset" type="number" value="3000"/> mm</label></section><section class="canvas"><svg id="plan" aria-label="Polygoneditor"></svg><aside><h2>Status</h2><p id="status"></p><p>Ziehe Eckpunkte. Klicke eine Wand, um die Anschlusskante zu wählen.</p></aside></section></main><script type="module" src="/src/main.ts"></script></body></html>
